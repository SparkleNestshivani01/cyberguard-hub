<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CyberGuard Hub - SOC Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased min-h-screen">
    <!-- Navbar -->
    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <i class="fa-solid fa-shield-halved text-cyan-400 text-2xl"></i>
            <span class="text-xl font-bold tracking-wider text-white">CYBERGUARD <span class="text-cyan-400">HUB</span></span>
        </div>
        <div class="flex items-center space-x-4">
            <span class="text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-3 py-1 rounded-full font-mono">SOC Active</span>
            <button onclick="runScan()" class="bg-cyan-600 hover:bg-cyan-500 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">
                <i class="fa-solid fa-rotate-right mr-2"></i>Run AI Scan
            </button>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto p-6 space-y-6">
        <!-- Threat Detection Section -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-slate-200 flex items-center">
                    <i class="fa-solid fa-triangle-exclamation text-amber-400 mr-2"></i> AI Anomaly & Threat Scanner
                </h2>
                <span class="text-xs text-slate-400">Model: Isolation Forest</span>
            </div>
            
            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm text-slate-300">
                    <thead class="bg-slate-900/50 text-slate-400 uppercase text-xs">
                        <tr>
                            <th class="p-3">Source IP</th>
                            <th class="p-3">Packet Size</th>
                            <th class="p-3">Req Rate</th>
                            <th class="p-3">Failed Logins</th>
                            <th class="p-3">Anomaly Score</th>
                            <th class="p-3">Severity</th>
                        </tr>
                    </thead>
                    <tbody id="threat-table-body" class="divide-y divide-slate-700">
                        <tr>
                            <td colspan="6" class="p-4 text-center text-slate-500">Click "Run AI Scan" to fetch latest network telemetries...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Password Security Analyzer -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 shadow-xl">
            <h2 class="text-lg font-semibold text-slate-200 mb-4 flex items-center">
                <i class="fa-solid fa-key text-cyan-400 mr-2"></i> Password Entropy & Security Analyzer
            </h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Test Password</label>
                    <input type="password" id="pwd-input" oninput="analyzePassword()" placeholder="Type a password..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-cyan-500">
                    <div class="mt-3 flex space-x-2">
                        <button onclick="generatePassword()" class="bg-slate-700 hover:bg-slate-600 text-xs px-3 py-2 rounded text-slate-300 transition">
                            <i class="fa-solid fa-wand-magic-sparkles mr-1"></i> Generate Secure Password
                        </button>
                    </div>
                </div>
                <div class="bg-slate-900/50 p-4 rounded-lg border border-slate-700/50 space-y-3">
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-slate-400">Strength Rating:</span>
                        <span id="pwd-status" class="font-bold text-slate-400">N/A</span>
                    </div>
                    <div class="flex justify-between items-center">
                        <span class="text-xs text-slate-400">Entropy Score:</span>
                        <span id="pwd-entropy" class="font-mono text-cyan-400">0.0 bits</span>
                    </div>
                    <div id="pwd-suggestions" class="text-xs text-amber-400 space-y-1"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function runScan() {
            const tbody = document.getElementById('threat-table-body');
            tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-cyan-400"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Analyzing network logs...</td></tr>';
            
            try {
                const res = await fetch('/api/v1/threats/scan', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({}) });
                const json = await res.json();
                
                tbody.innerHTML = '';
                json.data.forEach(item => {
                    const row = document.createElement('tr');
                    row.className = item.is_anomaly ? 'bg-red-500/10 hover:bg-red-500/20' : 'hover:bg-slate-700/30';
                    row.innerHTML = `
                        <td class="p-3 font-mono">${item.source_ip}</td>
                        <td class="p-3">${item.packet_size} B</td>
                        <td class="p-3">${item.request_rate}/s</td>
                        <td class="p-3">${item.failed_logins}</td>
                        <td class="p-3 font-mono">${item.anomaly_score}</td>
                        <td class="p-3"><span class="px-2 py-0.5 text-xs font-semibold rounded ${item.is_anomaly ? 'bg-red-500/20 text-red-400 border border-red-500/30' : 'bg-emerald-500/20 text-emerald-400'}">${item.severity}</span></td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-red-400">Error connecting to Threat Engine</td></tr>';
            }
        }

        async function analyzePassword() {
            const password = document.getElementById('pwd-input').value;
            if(!password) return;
            
            const res = await fetch('/api/v1/password/analyze', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ password })
            });
            const { data } = await res.json();
            
            const statusEl = document.getElementById('pwd-status');
            statusEl.innerText = data.status;
            statusEl.style.color = data.color;
            document.getElementById('pwd-entropy').innerText = `${data.entropy_bits} bits`;
            
            const suggEl = document.getElementById('pwd-suggestions');
            suggEl.innerHTML = data.suggestions.map(s => `<div>• ${s}</div>`).join('');
        }

        async function generatePassword() {
            const res = await fetch('/api/v1/password/generate');
            const data = await res.json();
            const input = document.getElementById('pwd-input');
            input.value = data.password;
            analyzePassword();
        }

        // Run initial scan on load
        runScan();
    </script>
</body>
</html>
